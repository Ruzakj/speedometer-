name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply ride insights upgrade
        run: |
          python3 tools/apply_ride_insights.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ruzakj/speedometer/MainActivityV2.kt
            git commit -m "feat: implement GPS health smart stop speed graph and overspeed alert"
            git push
          fi
      - name: Verify Gradle environment
        run: |
          java -version
          gradle --version
      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace --warning-mode all --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speedometer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
